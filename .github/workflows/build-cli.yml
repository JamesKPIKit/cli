name: Build Supabase CLI Binary

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build the CLI executable
        run: go build -o supabase
        
      - name: Upload the binary as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-cli-binary
          path: supabase
          
